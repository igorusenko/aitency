<div class="login-wrapper gap-4">
  <img src="https://aitency.com/wp-content/uploads/2025/01/AITENCY-Logo.svg" alt="">
  <div class="login p-6">
    @if (checkEmail) {
      <h3 class="text-center text-xl">Please check your email to reset your password.</h3>
    } @else {
      <form [formGroup]="forgotPasswordForm" (ngSubmit)="forgotPassword()" class="flex flex-col gap-4 w-full sm:w-56">
        <h3 class="text-center text-xl">Forgot Password</h3>

        <app-input
          [form]="forgotPasswordForm"
          [formSubmitted]="formSubmitted"
          controlName="email"
          title="Email"
          type="email"
        ></app-input>

        <button pButton severity="primary" type="submit"><span pButtonLabel>Submit</span></button>
        <div class="flex justify-between">
          <a [routerLink]="['/register']">Register</a>
          <a [routerLink]="['/login']">Login</a>
        </div>
      </form>
    }
  </div>

</div>
