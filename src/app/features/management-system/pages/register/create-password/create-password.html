<div class="login-wrapper gap-4">
  <img src="https://aitency.com/wp-content/uploads/2025/01/AITENCY-Logo.svg" alt="">
  <div class="login p-6">
    <form [formGroup]="registerCompleteForm" class="flex flex-col gap-4 w-full sm:w-56">
      <h3 class="text-center text-xl">Confirm password</h3>

      <div class="flex flex-col gap-1">
        <p-floatlabel variant="on">
          <input class="w-full" pInputText type="text" id="password" formControlName="password" autocomplete="off" [invalid]="isInvalidControl('password')" />
          <label for="password">Password</label>
        </p-floatlabel>
        @if (isInvalidControl('password')) {
          <p-message severity="error" size="small" variant="simple">Password required.</p-message>
        }
      </div>

      <div class="flex flex-col gap-1">
        <p-floatlabel variant="on">
          <input class="w-full" pInputText type="text" id="confirmPassword" formControlName="confirmPassword" autocomplete="off" [invalid]="isInvalidControl('confirmPassword')" />
          <label for="confirmPassword">Repeat password</label>
        </p-floatlabel>
        @if (isInvalidControl('confirmPassword')) {
          @if (hasMissmatchPasswordError()) {
            <p-message severity="error" size="small" variant="simple">Passwords don't match</p-message>
          } @else {
            <p-message severity="error" size="small" variant="simple">Repeat password required.</p-message>
          }
        }
      </div>

      <button pButton severity="primary" type="submit" (click)="setPassword()"><span pButtonLabel>Confirm password</span></button>
    </form>
  </div>

</div>
