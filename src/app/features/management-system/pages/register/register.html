<div class="login-wrapper gap-4">
  <img src="https://aitency.com/wp-content/uploads/2025/01/AITENCY-Logo.svg" alt="">
  <div class="login p-6">
    @if (checkEmail) {
      <h3 class="text-center text-xl">Please check your email to complete your registration.</h3>
    } @else {
      <form [formGroup]="registerForm" (ngSubmit)="register()" class="flex flex-col gap-4 w-full sm:w-56">
        <h3 class="text-center text-xl">Registration</h3>

        <app-input-text
          [form]="registerForm"
          [formSubmitted]="formSubmitted"
          controlName="email"
          title="Email"
          type="email"
        ></app-input-text>

        <app-input-text
          [form]="registerForm"
          [formSubmitted]="formSubmitted"
          controlName="firstName"
          title="First name"
          type="text"
        ></app-input-text>

        <app-input-text
          [form]="registerForm"
          [formSubmitted]="formSubmitted"
          controlName="lastName"
          title="Last name"
          type="text"
        ></app-input-text>

<!--        <app-input-text-->
<!--          [form]="registerForm"-->
<!--          [formSubmitted]="formSubmitted"-->
<!--          controlName="middleName"-->
<!--          title="Middle name"-->
<!--          type="text"-->
<!--        ></app-input-text>-->

        <app-checkbox
        [form]="registerForm"
        [formSubmitted]="formSubmitted"
        controlName="terms"
        title="Terms & Privacy"
        ></app-checkbox>

<!--        <div class="flex items-center gap-2">-->
<!--          <p-checkbox [formControlName]="'terms'" [binary]="true" [inputId]="'terms'" [invalid]="isInvalidControl('terms')" />-->
<!--          <label [for]="'terms'">Terms & Privacy</label>-->
<!--          @if (isInvalidControl('terms')) {-->
<!--            <p-message severity="error" size="small" variant="simple">Terms is required.</p-message>-->
<!--          }-->
<!--        </div>-->
        <!--      <div class="flex flex-col gap-1">-->
        <!--        <input-text pInputText placeholder="Password" name="password" formControlName="password"-->
        <!--               [invalid]="control('password').invalid && control('password').touched" required />-->
        <!--        @if (control('password').invalid && control('password').touched) {-->
        <!--          <p-message severity="error" size="small" variant="simple">Password is required.</p-message>-->
        <!--        }-->
        <!--      </div>-->
        <button pButton severity="primary" type="submit"><span pButtonLabel>Register</span></button>
        <div class="flex justify-between">
          <p>Already have an account?</p>
          <a [routerLink]="['/login']">Login</a>
        </div>
      </form>
    }
  </div>

</div>
