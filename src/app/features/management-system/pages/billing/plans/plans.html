<div class="flex justify-between items-center mb-4">
  <h1 class="text-2xl font-bold">Billing Plans</h1>
  @if (userStore.currentUser()?.role === 'Admin') {
    <p-button label="Create Plan" icon="pi pi-plus" (onClick)="openCreateDialog()"></p-button>
  }
</div>

<p-table
  [value]="plans()"
  [loading]="loading()"
  [paginator]="true"
  [rows]="10"
  [rowHover]="true"
  class="p-4 pb-0 bg-[#1018278c] rounded-2xl border border-[#FFFFFF14]">
  <ng-template pTemplate="header">
    <tr>
      <th>Name</th>
      <th>Description</th>
      <th>Price</th>
      <th>Currency</th>
      <th>Billing Cycle</th>
      <th>Actions</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-plan>
    <tr>
      <td>{{ plan.name }}</td>
      <td>{{ plan.description }}</td>
      <td>{{ plan.price }}</td>
      <td>{{ plan.currency }}</td>
      <td>{{ plan.billingCycle }}</td>
      <td>
        <div class="flex gap-2">
          <p-button label="Edit" icon="pi pi-pencil" severity="info" size="small" (onClick)="openEditDialog(plan)"></p-button>
          <p-button label="Delete" icon="pi pi-trash" severity="danger" size="small" (onClick)="deletePlan(plan)"></p-button>
        </div>
      </td>
    </tr>
  </ng-template>
  <ng-template pTemplate="emptymessage">
    <tr>
      <td colspan="6" class="text-center p-4">
        No plans found.
      </td>
    </tr>
  </ng-template>
</p-table>
