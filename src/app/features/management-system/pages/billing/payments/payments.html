<div class="flex flex-col gap-4">
  <h1 class="text-xl text-white font-bold">Payments</h1>
  <div class="flex flex-wrap items-start gap-4">
    <app-select
      [form]="filterForm"
      [options]="paymentGateways"
      controlName="type"
      title="Gateway"
      optionLabel="name"
      optionValue="value"
      class="min-w-48"
    ></app-select>
    <div class="flex flex-col gap-1 min-w-48">
      <p-floatlabel variant="on">
        <p-date-picker
          [formControl]="getControl('createdAtFrom')"
          [readonlyInput]="true"
          [showClear]="true"
          selectionMode="single"
          appendTo="body"
          class="w-full"
        ></p-date-picker>
        <label for="over_label">Date from</label>
      </p-floatlabel>
    </div>
    <div class="flex flex-col gap-1 min-w-48">
      <p-floatlabel variant="on">
        <p-date-picker
          [formControl]="getControl('createdAtTo')"
          [readonlyInput]="true"
          [showClear]="true"
          selectionMode="single"
          appendTo="body"
          class="w-full"
        ></p-date-picker>
        <label for="over_label">Date to</label>
      </p-floatlabel>
    </div>
    <app-input-text
      [form]="filterForm"
      controlName="reference"
      title="Reference"
      type="text"
      class="flex-1 min-w-48"
    ></app-input-text>
  </div>
  @if (userStore.currentUser().role === 'Admin') {
    <div class="flex gap-4">
      <p-button label="Record Manual Payment" severity="primary" size="small" (onClick)="visibleCreatePayment.set(true)"/>
      <p-button label="Adjust Balance" severity="secondary" size="small" (onClick)="visibleCreatePayment.set(true)"/>
    </div>
  }
  <p-table
    [value]="payments()"
    [loading]="loading()"
    [paginator]="true"
    [rows]="rows()"
    [totalRecords]="totalCount()"
    [lazy]="true"
    (onLazyLoad)="loadPayments($event)"
    [rowsPerPageOptions]="[10, 20, 50]"
    [rowHover]="true"
    class="p-4 pb-0 bg-[#1018278c] rounded-2xl border border-[#FFFFFF14]"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>Date</th>
        <th>Reference</th>
        <th>Payment Method</th>
        <th>Status</th>
        <th>Amount</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-tr>
      <tr>
        <td>{{ tr.createdAt | date:'medium' }}</td>
        <td>{{ tr.reference }}</td>
        <td>{{ tr.paymentMethod }}</td>
        <td>
          <p-tag [value]="tr.status" [severity]="getStatusSeverity(tr.status)"></p-tag>
        </td>
        <td [ngClass]="getAmountClass(tr.amount)">
          {{ (tr.amount >= 0 ? '+' : '') + formatCurrency(tr.amount, tr.currency) }}
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="6" class="text-center p-4 text-white/50">
          No payments found.
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
