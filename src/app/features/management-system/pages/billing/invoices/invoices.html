<div class="flex flex-col gap-4">
  <h1 class="text-xl text-white font-bold">Invoices</h1>
  <div class="flex flex-wrap items-start gap-4">
    <app-select
      [form]="filterForm"
      [options]="invoiceStatuses"
      controlName="status"
      title="Invoice Status"
      optionLabel="name"
      optionValue="name"
      class="min-w-48"
    ></app-select>
    <div class="flex flex-col gap-1 min-w-48">
      <p-floatlabel variant="on">
        <p-date-picker
          [readonlyInput]="true"
          [showClear]="true"
          selectionMode="single"
          appendTo="body"
          class="w-full"
        ></p-date-picker>
        <label for="over_label">Date</label>
      </p-floatlabel>
    </div>
    <div class="flex flex-col gap-1 min-w-48">
      <p-floatlabel variant="on">
        <p-date-picker
          [readonlyInput]="true"
          [showClear]="true"
          selectionMode="single"
          appendTo="body"
          class="w-full"
        ></p-date-picker>
        <label for="over_label">Due date</label>
      </p-floatlabel>
    </div>
    <app-input-text
      [form]="filterForm"
      controlName="search"
      title="Search Invoices..."
      type="text"
      class="flex-1 min-w-48"
    ></app-input-text>
  </div>
  @if (userStore.currentUser().role === 'Admin') {
    <p-button label="Create Invoice" severity="primary" size="small" (onClick)="visibleCreateInvoice.set(true)"/>
  }
  <p-table [value]="invoices" class="p-4 pb-0 bg-[#1018278c] rounded-2xl">
    <ng-template pTemplate="header">
      <tr>
        <th>Invoice#</th>
        <th>Date</th>
        <th>Due Date</th>
        <th>Amount</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-tr>
      <tr>
        <td>{{ tr.invoice }}</td>
        <td>{{ tr.date | date }}</td>
        <td>{{ tr.dueDate | date }}</td>
        <td [ngClass]="getAmountClass(tr.amount)">
          {{ (tr.amount >= 0 ? '+' : '') + formatCurrency(tr.amount) }}
        </td>
        <td>
          <p-tag [value]="tr.status" [severity]="tr.status"></p-tag>
        </td>
        <td class="font-medium">
          <div class="flex gap-2">
            <p-button (onClick)="visibleInvoiceInfo.set(true)" label="View" severity="primary" size="small"/>
            <p-button label="Pdf" severity="primary" size="small"/>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<app-create-invoice [(visible)]="visibleCreateInvoice"></app-create-invoice>
<app-invoice-info [(visible)]="visibleInvoiceInfo"></app-invoice-info>
