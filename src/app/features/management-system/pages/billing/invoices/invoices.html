<div class="flex flex-col gap-4">
  <h1 class="text-xl text-white font-bold">Invoices</h1>
  <div class="flex flex-wrap items-start gap-4">
    <app-select
      [form]="filterForm"
      [options]="invoiceStatuses"
      controlName="status"
      title="Invoice Status"
      optionLabel="name"
      optionValue="value"
      class="min-w-48"
    ></app-select>
    <div class="flex flex-col gap-1 min-w-48">
      <p-floatlabel variant="on">
        <p-date-picker
          [formControl]="getControl('dateIssuedFrom')"
          [readonlyInput]="true"
          [showClear]="true"
          selectionMode="single"
          appendTo="body"
          class="w-full"
        ></p-date-picker>
        <label for="over_label">Date from</label>
      </p-floatlabel>
    </div>
    <div class="flex flex-col gap-1 min-w-48">
      <p-floatlabel variant="on">
        <p-date-picker
          [formControl]="getControl('dateIssuedTo')"
          [readonlyInput]="true"
          [showClear]="true"
          selectionMode="single"
          appendTo="body"
          class="w-full"
        ></p-date-picker>
        <label for="over_label">Date to</label>
      </p-floatlabel>
    </div>
    <app-input-text
      [form]="filterForm"
      controlName="invoiceNumber"
      title="Invoice#"
      type="text"
      class="flex-1 min-w-48"
    ></app-input-text>
  </div>
  @if (userStore.currentUser()?.role === 'Admin') {
    <p-button label="Create Invoice" severity="primary" size="small" (onClick)="visibleCreateInvoice.set(true)"/>
  }
  <p-table
    [value]="invoices()"
    [loading]="loading()"
    [paginator]="true"
    [rows]="rows()"
    [totalRecords]="totalCount()"
    [lazy]="true"
    (onLazyLoad)="loadInvoices($event)"
    [rowsPerPageOptions]="[10, 20, 50]"
    [rowHover]="true"
    class="p-4 pb-0 bg-[#1018278c] rounded-2xl border border-[#FFFFFF14]"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>Invoice#</th>
        <th>Issue Date</th>
        <th>Due Date</th>
        <th>Amount</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-tr>
      <tr>
        <td>{{ tr.invoiceNumber }}</td>
        <td>{{ tr.dateIssued | date }}</td>
        <td>{{ tr.dueDate | date }}</td>
        <td [ngClass]="getAmountClass(tr.total)">
          {{ formatCurrency(tr.total, tr.currency) }}
        </td>
        <td>
          <p-tag [value]="tr.status" [severity]="'success'"></p-tag>
        </td>
        <td class="font-medium">
          <div class="flex gap-2">
            <p-button (onClick)="visibleInvoiceInfo.set(true)" label="View" severity="primary" size="small"/>
            <p-button label="Pdf" severity="primary" size="small"/>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="6" class="text-center p-4 text-white/50">
          No invoices found.
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<app-create-invoice [(visible)]="visibleCreateInvoice"></app-create-invoice>
<app-invoice-info [(visible)]="visibleInvoiceInfo"></app-invoice-info>
