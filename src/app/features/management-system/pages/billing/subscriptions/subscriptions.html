<div class="flex flex-col gap-8">
  <!-- Plans Section extracted to component -->
  <app-plans-list
    [plans]="plans()"
    [isAlreadySubscribed]="isAlreadySubscribed.bind(this)"
    (subscribe)="subscribeToPlan($event)">
  </app-plans-list>

  <div class="flex flex-col gap-4">
    <h2 class="text-2xl font-bold text-white">Active Subscriptions</h2>

    <app-active-subscriptions
      [subscriptions]="subscriptions()"
      (upgrade)="openUpgradeDialog($event)"
      (cancel)="openCancelDialog($event)">
    </app-active-subscriptions>
  </div>
</div>
