<div class="flex flex-col gap-4">
  <h2 class="text-2xl font-bold text-white">Available Plans</h2>

  <div class="grid gap-5 grid-cols-3">
    @for (plan of plans; track plan?.id) {
      <div class="rounded-2xl border border-white/10 bg-[#1018278c] p-5 shadow-lg backdrop-blur-sm">
        <div class="mb-4">
          <div class="mb-1 text-base font-semibold text-white">
            {{ plan.name }}
          </div>
          <div class="text-3xl font-bold text-green-400">
            {{ plan.price | currency: plan.currency }}
            <span class="ml-1 text-base font-normal text-white/70">/ {{ plan.billingCycle }}</span>
          </div>
          @if (plan.description) {
            <div class="mt-2 text-sm text-white/70">{{ plan.description }}</div>
          }
        </div>

        <div class="my-4 border-t border-white/10"></div>

        <div class="space-y-3 text-sm text-white/70">
          <div class="flex items-center justify-between gap-3">
            <span>Billing Cycle:</span>
            <span class="text-white">{{ plan.billingCycle }}</span>
          </div>
          <div class="flex items-center justify-between gap-3">
            <span>Status:</span>
            <p-tag
              [value]="plan.isActive ? 'Active' : 'Inactive'"
              [severity]="plan.isActive ? 'success' : 'secondary'">
            </p-tag>
          </div>
        </div>

        <div class="mt-5">
          @if (plan.isActive) {
            <p-button
              [disabled]="isAlreadySubscribed?.(plan.id)"
              label="Subscribe"
              icon="pi pi-check"
              severity="success"
              styleClass="w-full"
              (onClick)="onSubscribe(plan.id)">
            </p-button>
          }
        </div>
      </div>
    } @empty {
      <div class="col-span-full rounded-2xl border border-white/10 bg-[#1018278c] p-4 text-center text-white/70">
        No plans available.
      </div>
    }
  </div>
</div>
