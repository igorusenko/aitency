<p-dialog header="Create new invoice" [modal]="true" [(visible)]="visible" [style]="{ width: '25rem' }">
  <form action="" [formGroup]="invoiceForm" class="flex flex-col gap-4 pb-4">
    <div class="flex flex-col gap-1">
      <p-floatlabel variant="on">
        <p-date-picker
          [readonlyInput]="true"
          [showClear]="true"
          selectionMode="single"
          appendTo="body"
          class="w-full"
        ></p-date-picker>
        <label for="over_label">Due date</label>
      </p-floatlabel>
    </div>
    <div class="flex flex-col gap-1">
      <app-input-text
        [form]="invoiceForm"
        [formSubmitted]="formSubmitted"
        controlName="description"
        title="Description"
        type="text"
      >
      </app-input-text>
    </div>
    <div class="flex flex-col gap-1">
      <app-input-number
        [form]="invoiceForm"
        [formSubmitted]="formSubmitted"
        controlName="amount"
        label="Amount €"
      >
      </app-input-number>
    </div>
    <div class="flex flex-col gap-1">
      <app-input-text
        [form]="invoiceForm"
        [formSubmitted]="formSubmitted"
        [textarea]="true"
        controlName="note"
        title="Note"
        type="text"
      >
      </app-input-text>
    </div>
  </form>

  <div class="flex justify-end gap-2">
    <p-button label="Cancel" severity="secondary" (onClick)="visible.set(false)" />
    <p-button label="Save" (onClick)="visible.set(false)" />
  </div>
</p-dialog>
