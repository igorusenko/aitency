<p-dialog header="Create new invoice" [modal]="true" [(visible)]="visible" [style]="{ width: '35rem' }">
  <form [formGroup]="invoiceForm" class="flex flex-col gap-4 pb-4">
    <app-select
      [form]="invoiceForm"
      [options]="clientOptions()"
      [filter]="true"
      (onFilter)="onFilter($event)"
      controlName="clientId"
      title="Client"
      optionLabel="label"
      optionValue="value"
      class="w-full"
    ></app-select>

    <div class="flex gap-2">
      <div class="flex-1 flex flex-col gap-1">
        <app-input-text
          [form]="invoiceForm"
          [formSubmitted]="formSubmitted"
          controlName="invoiceNumber"
          title="Invoice #"
          type="text"
        >
        </app-input-text>
      </div>
      <div class="flex-1 flex flex-col gap-1">
        <p-floatlabel variant="on">
          <p-date-picker
            [formControl]="getControl('dueDate')"
            [readonlyInput]="true"
            [showClear]="true"
            selectionMode="single"
            appendTo="body"
            class="w-full"
          ></p-date-picker>
          <label for="over_label">Due date</label>
        </p-floatlabel>
      </div>
    </div>

    <div class="flex gap-2">
      <div class="flex-1 flex flex-col gap-1">
        <app-input-number
          [form]="invoiceForm"
          [formSubmitted]="formSubmitted"
          controlName="discountAmount"
          label="Discount amount"
        >
        </app-input-number>
      </div>
      <div class="flex-1 flex flex-col gap-1">
        <app-input-number
          [form]="invoiceForm"
          [formSubmitted]="formSubmitted"
          controlName="taxAmount"
          label="Tax amount"
        >
        </app-input-number>
      </div>
    </div>

    <div class="flex flex-col gap-1">
      <app-input-text
        [form]="invoiceForm"
        [formSubmitted]="formSubmitted"
        [textarea]="true"
        controlName="note"
        title="Notes"
        type="text"
      >
      </app-input-text>
    </div>

    <!-- Lines Block -->
    <div class="flex flex-col gap-4 border border-white/10 p-3 rounded-xl bg-white/5">
      <div class="flex justify-between items-center">
        <span class="text-sm font-bold text-white/70">Invoice Lines</span>
        <p-button label="Add Line" icon="pi pi-plus" size="small" [text]="true" (onClick)="addLine()" />
      </div>

      <div formArrayName="lines" class="flex flex-col gap-6">
        @for (line of lines.controls; let i = $index; track line) {
          <div [formGroupName]="i" class="flex flex-col gap-3 relative border-b border-white/5 pb-4 last:border-b-0">
            <div class="flex justify-between items-start">
              <span class="text-xs text-white/40">Line #{{ i + 1 }}</span>
              @if (lines.length > 1) {
                <p-button icon="pi pi-trash" severity="danger" [text]="true" size="small" (onClick)="removeLine(i)" />
              }
            </div>

            <div class="flex gap-2">
              <div class="flex-1 flex flex-col gap-1">
                <app-select
                  [form]="getLineForm(i)"
                  [options]="lineTypeOptions"
                  controlName="lineType"
                  title="Line type"
                  optionLabel="label"
                  optionValue="value"
                  class="w-full"
                ></app-select>
              </div>
              <div class="flex flex-col gap-1">
                <app-input-number
                  [form]="getLineForm(i)"
                  [formSubmitted]="formSubmitted"
                  controlName="quantity"
                  [min]="1"
                  [maxFractionDigits]="0"
                  label="Qty"
                >
                </app-input-number>
              </div>
            </div>

            <div class="flex gap-2">
              <div class="flex-1 flex flex-col gap-1">
                <app-input-text
                  [form]="getLineForm(i)"
                  [formSubmitted]="formSubmitted"
                  controlName="description"
                  title="Description"
                  type="text"
                >
                </app-input-text>
              </div>
              <div class="flex-1 flex flex-col gap-1">
                <app-input-number
                  [form]="getLineForm(i)"
                  [formSubmitted]="formSubmitted"
                  [min]="0.1"
                  [minFractionDigits]="2"
                  [maxFractionDigits]="2"
                  controlName="unitPrice"
                  label="Unit price"
                >
                </app-input-number>
              </div>
            </div>
          </div>
        }
      </div>
    </div>
  </form>

  <div class="flex justify-end gap-2">
    <p-button label="Cancel" severity="secondary" (onClick)="visible.set(false)" />
    <p-button label="Save" (onClick)="createAdminInvoice()" />
  </div>
</p-dialog>
