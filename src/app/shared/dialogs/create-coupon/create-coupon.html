<form [formGroup]="form" (ngSubmit)="save()" class="flex flex-col gap-3 pt-1">
  <div class="grid grid-cols-2 gap-4">
    <app-input-text [form]="form" [formSubmitted]="formSubmitted()" controlName="code" title="Code"></app-input-text>
    <app-select
      [form]="form"
      [formSubmitted]="formSubmitted()"
      controlName="type"
      title="Type"
      [options]="couponTypeOptions"
      optionLabel="label"
      optionValue="value"
    ></app-select>
  </div>

  <div class="grid grid-cols-2 gap-4">
    <app-input-number
      [form]="form"
      [formSubmitted]="formSubmitted()"
      controlName="value"
      label="Value"
    ></app-input-number>

    <div class="flex flex-col gap-1 min-w-48">
      <p-floatlabel variant="on">
        <p-date-picker
          [formControl]="form.controls.expiryDate"
          [readonlyInput]="true"
          [showClear]="true"
          selectionMode="single"
          appendTo="body"
          class="w-full"
        ></p-date-picker>
        <label for="expiry_date_label">Expiry Date</label>
      </p-floatlabel>
    </div>
  </div>

  <div class="grid grid-cols-2 gap-4">
    <app-input-number
      [form]="form"
      [formSubmitted]="formSubmitted()"
      controlName="usageLimit"
      label="Usage limit"
    ></app-input-number>
    <app-input-number
      [form]="form"
      [formSubmitted]="formSubmitted()"
      controlName="maxPerClient"
      label="Max per client"
    ></app-input-number>
  </div>

  <div class="flex justify-end space-x-2">
    <p-button label="Cancel" icon="pi pi-times" severity="secondary" (onClick)="close()"></p-button>
    <p-button label="Create" icon="pi pi-check" type="submit" [disabled]="form.invalid"></p-button>
  </div>
</form>
