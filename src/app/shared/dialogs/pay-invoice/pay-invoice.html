<form [formGroup]="invoiceForm" class="flex flex-col gap-4">
  @if (invoice) {
    <div class="text-sm text-gray-600">
      <p><strong>Invoice #:</strong> {{ invoice.invoiceNumber }}</p>
      <p><strong>Amount:</strong> {{ invoice.total }} {{ invoice.currency }}</p>
    </div>
  }
  @if (invoice.type === 'Invoice' && (invoice.status === 'Issued' || invoice.status === 'Overdue')) {
  <div class="flex gap-2">
    <app-input-text
      [form]="invoiceForm"
      controlName="couponCode"
      title="Coupon Code"
      class="flex-1"
    ></app-input-text>
    <p-button label="Apply Coupon" severity="success" (onClick)="applyCoupon()"/>
  </div>
  }
  <app-select
    [form]="invoiceForm"
    [options]="getPaymentMethodOptions()"
    controlName="paymentMethod"
    title="Payment Method"
    optionLabel="label"
    optionValue="value"
    class="w-full"
  ></app-select>

  <div class="flex justify-end gap-2">
    <p-button label="Cancel" severity="secondary" (onClick)="close()"/>
    <p-button label="Pay" severity="success" (onClick)="payInvoice()"/>
  </div>
</form>
