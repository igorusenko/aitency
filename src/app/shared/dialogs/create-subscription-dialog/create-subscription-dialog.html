<p-dialog header="Create Subscription" [visible]="visible()" (visibleChange)="visibleChange.emit($event)" modal="true" styleClass="w-full max-w-2xl">
  <form [formGroup]="form" (ngSubmit)="save()" class="space-y-4">
    <app-select [form]="form" [formSubmitted]="formSubmitted()" controlName="planId" title="Select Plan" [options]="planOptions()" [optionValue]="'value'"></app-select>
    <div class="flex justify-end space-x-2">
      <p-button label="Cancel" icon="pi pi-times" severity="secondary" (onClick)="close()"></p-button>
      <p-button label="Create" icon="pi pi-check" type="submit" [disabled]="form.invalid"></p-button>
    </div>
  </form>
</p-dialog>
