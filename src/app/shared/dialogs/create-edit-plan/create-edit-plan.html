<form [formGroup]="form" (ngSubmit)="save()" class="flex flex-col gap-3 pt-1">
  <div class="grid grid-cols-2 gap-4">
    <app-input-text [form]="form" [formSubmitted]="formSubmitted()" controlName="name" title="Name"></app-input-text>
    <app-input-text [form]="form" [formSubmitted]="formSubmitted()" controlName="slug" title="Slug"></app-input-text>
  </div>
  <div class="grid grid-cols-2 gap-4">
    <app-input-number
      [form]="form"
      [formSubmitted]="formSubmitted()"
      controlName="price"
      label="Price"
    ></app-input-number>
    <app-select
      [form]="form"
      [formSubmitted]="formSubmitted()"
      controlName="billingCycle"
      title="Billing Cycle"
      [optionValue]="'value'"
      [options]="billingCycleOptions"
    ></app-select>
  </div>
  <div class="grid grid-cols-2 gap-4">
    <app-input-text [readonly]="true" [form]="form" [formSubmitted]="formSubmitted()" controlName="currency" title="Currency"></app-input-text>
    <div></div>
  </div>
  <p-floatlabel variant="on">
    <app-input-text [textarea]="true" [form]="form" [formSubmitted]="formSubmitted()" controlName="description" title="Description"></app-input-text>
  </p-floatlabel>
  <app-checkbox
    [form]="form"
    [formSubmitted]="formSubmitted()"
    controlName="isActive"
    title="Active"
  ></app-checkbox>

  <!-- Lines Block -->
  <div class="flex flex-col gap-4 border border-white/10 p-3 rounded-xl bg-white/5">
    <div class="flex justify-between items-center">
      <span class="text-sm font-bold text-white/70">Usage Rates</span>
      <p-button label="Add Usage Rate" icon="pi pi-plus" size="small" [text]="true" (onClick)="addUsageRate()" />
    </div>

    <div formArrayName="usageRates" class="flex flex-col gap-6">
      @for (usageRate of usageRates.controls; let i = $index; track usageRate) {
        <div [formGroupName]="i" class="flex flex-col gap-3 relative border-b border-white/5 pb-4 last:border-b-0">
          <div class="flex justify-between items-start">
            <span class="text-xs text-white/40">Usage Rate #{{ i + 1 }}</span>
            @if (usageRates.length > 1) {
              <p-button icon="pi pi-trash" severity="danger" [text]="true" size="small" (onClick)="removeUsageRate(i)" />
            }
          </div>

          <div class="flex gap-2">
            <div class="flex-1 flex flex-col gap-1">
              <app-input-text
                [form]="getUsageRateForm(i)"
                [formSubmitted]="formSubmitted()"
                controlName="metricName"
                title="Metric Name"
                type="text"
              >
              </app-input-text>
            </div>
            <div class="flex flex-col gap-1">
              <app-input-number
                [form]="getUsageRateForm(i)"
                [formSubmitted]="formSubmitted()"
                controlName="includedUnits"
                label="Included Units"
              >
              </app-input-number>
            </div>
          </div>

          <div class="flex gap-2">
            <div class="flex-1 flex flex-col gap-1">
              <app-input-number
                [form]="getUsageRateForm(i)"
                [formSubmitted]="formSubmitted()"
                [minFractionDigits]="2"
                [maxFractionDigits]="6"
                controlName="ratePerUnit"
                label="Rate Per Unit"
                type="text"
              >
              </app-input-number>
            </div>
            <div class="flex-1 flex flex-col gap-1">
              <app-select
                [form]="getUsageRateForm(i)"
                [options]="usageRatePeriods"
                appendTo="body"
                controlName="periodType"
                title="Period Type"
                optionLabel="label"
                optionValue="value"
                class="w-full"
              ></app-select>
            </div>
          </div>
        </div>
      }
    </div>
  </div>

  <div class="flex justify-end space-x-2">
    <p-button label="Cancel" icon="pi pi-times" severity="secondary" (onClick)="close()"></p-button>
    <p-button label="Save" icon="pi pi-check" type="submit" [disabled]="form.invalid"></p-button>
  </div>
</form>
