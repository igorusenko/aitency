<p-dialog
  [header]="plan() ? 'Edit Plan' : 'Create Plan'"
  [visible]="visible()"
  (visibleChange)="visibleChange.emit($event)"
  modal="true"
  [style]="{ width: '35rem' }"
>
  <form [formGroup]="form" (ngSubmit)="save()" class="space-y-4">
    <div class="grid grid-cols-2 gap-4">
      <app-input-text [form]="form" [formSubmitted]="formSubmitted()" controlName="name" title="Name"></app-input-text>
      <app-input-text [readonly]="true" [form]="form" [formSubmitted]="formSubmitted()" controlName="currency" title="Currency"></app-input-text>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <app-input-number
        [form]="form"
        [formSubmitted]="formSubmitted()"
        controlName="price"
        label="Price"
      ></app-input-number>
      <app-select [form]="form" [formSubmitted]="formSubmitted()" controlName="interval" title="Interval" [options]="intervalOptions"></app-select>
    </div>
    <p-floatlabel variant="on">
      <app-input-text
        [form]="form"
        [formSubmitted]="formSubmitted()"
        [textarea]="true"
        controlName="description"
        title="Description"
        type="text"
      >
      </app-input-text>
    </p-floatlabel>
    <div class="flex items-center space-x-2">
      <app-checkbox
        [form]="form"
        [formSubmitted]="formSubmitted()"
        controlName="isActive"
        title="Active"
      ></app-checkbox>
    </div>
    <div class="flex justify-end space-x-2">
      <p-button label="Cancel" icon="pi pi-times" severity="secondary" (onClick)="visibleChange.emit(false)"></p-button>
      <p-button label="Save" icon="pi pi-check" type="submit" [disabled]="form.invalid"></p-button>
    </div>
  </form>
</p-dialog>
