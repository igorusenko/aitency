<div class="flex flex-col gap-1">
  <p-floatlabel variant="on">
    <input class="w-full"
           pInputText
           autocomplete="off"
           [type]="type() || 'text'"
           [id]="controlName()"
           [formControl]="control()"
           [invalid]="isInvalidControl()"
    />
    <label [for]="controlName()!">{{ title() }}</label>
  </p-floatlabel>

  @if (isInvalidControl()) {
    <p-message
      severity="error"
      size="small"
      variant="simple"
    >
      {{ getErrorMessage() }}
    </p-message>
  }
</div>
