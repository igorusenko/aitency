<div class="flex flex-col gap-1">
  <p-floatlabel variant="on">
    @if (textarea()) {
      <textarea
        class="w-full"
        rows="5"
        cols="30"
        pTextarea
        [id]="controlName()"
        [formControl]="control()"
        [invalid]="isInvalidControl()"
        [readOnly]="readonly()"
      >

      </textarea>
    } @else {
      <input class="w-full"
             pInputText
             autocomplete="off"
             [type]="type() || 'text'"
             [id]="controlName()"
             [formControl]="control()"
             [invalid]="isInvalidControl()"
             [readOnly]="readonly()"
      />
    }
    <label [for]="controlName()!">{{ title() }}</label>
  </p-floatlabel>

  @if (isInvalidControl()) {
    <p-message
      severity="error"
      size="small"
      variant="simple"
    >
      {{ getErrorMessage() }}
    </p-message>
  }
</div>
